# Runs the backend (FastAPI + yt-dlp + ffmpeg) in Docker.
# The Next.js frontend is separate / not deployed here.
# Domain: offlineify.nachiketkandari.tech
services:
  backend:
    build: .
    ports:
      # Loopback only: Caddy (same host) reaches it via localhost:8005 and
      # terminates TLS. Binding 0.0.0.0 would expose the API straight to the
      # internet on :8005, sending the Basic password in cleartext.
      - "127.0.0.1:8005:8000"
    restart: unless-stopped
    volumes:
      - ./downloads:/app/downloads
      - ./downloaded_songs.json:/app/downloaded_songs.json
    environment:
      - PORT=8000
      # Concurrent playlist jobs. 2 matches this box's core count; each job
      # still downloads its own tracks sequentially, keeping the per-track
      # pause that avoids YouTube rate limits.
      - MAX_CONCURRENT_JOBS=2
      # Set OFFLINEIFY_PASSWORD to require a shared password for every request.
      # Leave empty to keep the API open.
      - OFFLINEIFY_PASSWORD=${OFFLINEIFY_PASSWORD:-}
