# Runs the backend (FastAPI + yt-dlp + ffmpeg) in Docker.
#
# The Next.js frontend is separate: either `cd web/ui && npm run dev` locally,
# or a Vercel deployment pointed at this backend via NEXT_PUBLIC_BACKEND_URL.
#
# Usage: docker compose up --build
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    # No credentials required: the backend receives the user's Spotify token
    # per request from the UI, and falls back to Spotify's public embed page.
    # Set OFFLINEIFY_PASSWORD in the environment to require a shared password.
    environment:
      - OFFLINEIFY_PASSWORD=${OFFLINEIFY_PASSWORD:-}
    volumes:
      # Keep downloads and the dedupe index across restarts.
      - ./downloads:/app/downloads
      - ./downloaded_songs.json:/app/downloaded_songs.json
